<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="csrf-token" content="{{ csrf_token() }}" />
    <title>{% block title %}NEXUS — Play the Edge{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
    {% block head %}{% endblock %}
  </head>
  <body class="{% block body_class %}{% endblock %}">
    <div class="site-shell" id="top">
      <div class="ambient ambient-one"></div>
      <div class="ambient ambient-two"></div>
      <div class="grain"></div>
      <header class="nav-wrap">
        <nav class="nav container" aria-label="Primary navigation">
          <a class="logo" href="{{ url_for('home') }}" aria-label="Nexus home">
            <span class="logo-mark"><i></i><i></i><i></i></span>
            <span>NEXUS<span class="logo-muted"> // PLAY</span></span>
          </a>
          <div class="nav-links" id="nav-links">
            <a href="{{ url_for('home') }}#games">Games</a>
            <a href="{{ url_for('home') }}#community">Community</a>
            <a href="{{ url_for('home') }}#events">Events</a>
          </div>
          <div class="nav-actions">
            <a class="button button-small button-outline" href="{{ url_for('dashboard') }}">Dashboard</a>
            <a class="login-button" href="{{ url_for('logout') }}">Log out</a>
            <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">
              <span></span><span></span>
            </button>
          </div>
        </nav>
      </header>

      <main>{% block content %}{% endblock %}</main>

      <div id="nexusToast" class="toast access-toast" role="status" aria-live="polite" hidden></div>
      <footer class="footer container dashboard-footer">
        <div class="footer-bottom">
          <span>© 2026 Nexus Interactive</span>
          <span>Built for the curious <i>✦</i></span>
          <div><a href="{{ url_for('home') }}#top">Back to home</a></div>
        </div>
      </footer>
    </div>
    {% block scripts %}{% endblock %}
  </body>
</html>
